{% extends "base.html" %}
{% block content %}
<h2>Upload Video Lesson for Grade {{ grade }}</h2>
<form method="POST" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Title" required><br>
    <textarea name="description" placeholder="Description"></textarea><br>
    <input type="text" name="subject" placeholder="Subject" required><br>
    <input type="number" name="duration" placeholder="Duration (minutes)" required><br>
    <input type="file" name="video_file" accept="video/*" required><br><br>
    <button type="submit" class="btn btn-warning">Upload Video</button>
</form>
{% endblock %}
