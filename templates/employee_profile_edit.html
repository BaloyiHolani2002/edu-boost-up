{% extends "base.html" %}
{% block content %}

<div class="logo">
            <img src="/static/images/edo_logo.png.jpeg" alt="Edu Boost Up Logo">
          </div>
<h2>Edit Profile</h2>

<form method="POST">
    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ mentor.name }}" class="form-control" required>
    </div>

    <div class="form-group">
        <label>Surname</label>
        <input type="text" name="surname" value="{{ mentor.surname }}" class="form-control" required>
    </div>

    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ mentor.phone }}" class="form-control">
    </div>

    <div class="form-group">
        <label>Subject Speciality</label>
        <input type="text" name="subject_speciality" value="{{ mentor.subject_speciality }}" class="form-control">
    </div>

    <div class="form-group">
        <label>Bio</label>
        <textarea name="bio" class="form-control">{{ mentor.bio }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="/employee/dashboard" class="btn btn-secondary">Back</a>
</form>

{% endblock %}
