<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Edu Boost Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4b79a1, #283e51);
            color: white;
            text-align: center;
            padding-top: 90px;
        }
        .login-box {
            background: white;
            color: #333;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            margin: auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #888;
        }
        .btn {
            background: #4b79a1;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            display: block;
            width: 95%;
            margin-top: 15px;
        }
        .error {
            color: red;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    {% if error_message %}
        <p class="error">{{ error_message }}</p>
    {% endif %}

    <form action="/admin-login" method="POST">
    <input type="email" name="email" placeholder="Admin Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>
</div>

</body>
</html>
