<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mentor Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }
        .login-box { background:white; padding:35px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); width:350px; }
        .login-box h2 { text-align:center; margin-bottom:20px; }
        input { width:100%; padding:10px; margin-top:10px; border-radius:6px; border:1px solid #ccc; }
        button { width:100%; margin-top:15px; padding:10px; background:#007bff; border:none; border-radius:6px; color:white; cursor:pointer; }
        button:hover { background:#0056b3; }
        .error { color:red; text-align:center; margin-top:10px; }
        a { display:block; text-align:center; margin-top:15px; color:#007bff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Mentor Login</h2>

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <form action="/mentor-login" method="POST">
            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
