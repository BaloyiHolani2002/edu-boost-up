{% extends "base.html" %}
{% block content %}
<h2>Upload Content for Grade {{ grade }}</h2>

<form method="POST" enctype="multipart/form-data">

    <input type="text" name="title" placeholder="Title" class="form-control" required><br>

    <textarea name="description" placeholder="Description" class="form-control"></textarea><br>

    <input type="text" name="subject" placeholder="Subject" class="form-control" required><br>

    <label>PDF File (Optional):</label>
    <input type="url" name="pdf_file" placeholder="Paste pdf link here" class="form-control"><br><br>

    <label>Video Link (Google Drive / YouTube / Any Link):</label>
    <input type="url" name="video_link" placeholder="Paste video link here" class="form-control" required><br><br>

    <button type="submit" class="btn btn-success">Save Content</button>

</form>
{% endblock %}
