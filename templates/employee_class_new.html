{% extends "base.html" %}
{% block content %}

<div class="logo">
            <img src="/static/images/edo_logo.png.jpeg" alt="Edu Boost Up Logo">
          </div>
<h2>Create a New Class</h2>

<form method="POST" class="form-group">

    <label>Class Title:</label>
    <input type="text" name="title" class="form-control" required><br>

    <label>Topic:</label>
    <input type="text" name="topic" class="form-control"><br>

    <label>Class Type (Online / Physical / Video):</label>
    <input type="text" name="type" class="form-control"><br>

    <label>Start Time:</label>
    <input type="datetime-local" name="start_time" class="form-control"><br>

    <label>Duration (minutes):</label>
    <input type="number" name="duration" class="form-control" min="1"><br>

    <label>Grade:</label>
    <input type="text" name="grade" class="form-control" required><br>

    <label>Meeting/Video Link:</label>
    <input type="text" name="link" class="form-control"><br>

    <button type="submit" class="btn btn-primary">Post Class</button>
</form>

{% endblock %}
